<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Toko Kyy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --orange-main: #f97316;
      --orange-hover: #ea580c;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
    body { 
      background-color: var(--bg-dark); 
      color: var(--text-light); 
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      padding: 32px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .login-header i {
      font-size: 40px;
      color: var(--orange-main);
      margin-bottom: 12px;
    }

    .login-header h2 {
      font-size: 20px;
      color: var(--text-light);
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input { 
      width: 100%; 
      padding: 12px; 
      background: var(--bg-dark); 
      border: 1px solid var(--border-dark); 
      border-radius: 6px; 
      color: white; 
      font-size: 13px; 
      outline: none; 
    }
    .form-group input:focus { border-color: var(--orange-main); }

    .btn-submit {
      width: 100%;
      background: var(--orange-main);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover { background: var(--orange-hover); }

    .back-to-store {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
    }
    .back-to-store:hover { color: var(--text-light); }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <i class="fa-solid fa-user-shield"></i>
      <h2>Login Admin</h2>
      <p>Masukkan username dan password untuk masuk ke dashboard</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required>
      </div>

      <button type="submit" class="btn-submit">Masuk ke Admin</button>
    </form>

    <a href="index.html" class="back-to-store"><i class="fa-solid fa-arrow-left"></i> Kembali ke Toko</a>
  </div>

  <script>
    // Kredensial default admin
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "admin123";

    // Jika sudah login, langsung lempar ke Halaman Admin
    if (localStorage.getItem("kyy_admin_logged") === "true") {
      window.location.href = "admin.html";
    }

    function handleLogin(e) {
      e.preventDefault();
      
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        // Simpan sesi login di LocalStorage
        localStorage.setItem("kyy_admin_logged", "true");
        
        // Alihkan ke halaman admin
        window.location.href = "admin.html";
      } else {
        alert("Username atau Password salah!");
      }
    }
  </script>
</body>
</html>
