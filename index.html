<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Kyy - Online Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --orange-main: #f97316;
      --orange-hover: #ea580c;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
    html { height: 100%; }

    body { 
      background-color: var(--bg-dark); 
      color: var(--text-light); 
      padding: 12px; 
      line-height: 1.5; 
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Running Text Banner */
    .announce-bar {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 10px auto;
      background: var(--orange-main);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
    }

    /* Top Nav */
    .top-nav {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 12px auto;
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--orange-main);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 6px; }
    .nav-btn {
      background: var(--bg-dark);
      color: var(--text-light);
      border: 1px solid var(--border-dark);
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .nav-btn.active { border-color: var(--orange-main); color: var(--orange-main); }
    .badge { background: var(--orange-main); color: white; border-radius: 10px; padding: 1px 6px; font-size: 10px; }

    /* Main Container toko */
    .store-container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background: var(--card-dark);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border-dark);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Category Filter Bar */
    .cat-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background: var(--bg-dark);
      color: var(--text-muted);
      border: 1px solid var(--border-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active { background: var(--orange-main); color: white; border-color: var(--orange-main); }

    /* Grid Produk (Selalu 2 Kolom) */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .product-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .product-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .product-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .product-price { font-size: 13px; font-weight: 700; color: var(--orange-main); margin-bottom: 8px; }
    
    .btn-action-group {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }
    .btn-add-cart {
      flex: 1;
      background: var(--bg-dark);
      color: var(--orange-main);
      border: 1px solid var(--orange-main);
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-buy-now {
      flex: 1;
      background: var(--orange-main);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modal Pop-up Keranjang & Pembayaran */
    .cart-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }
    .cart-box {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-dark);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .cart-header h3 { font-size: 14px; color: var(--orange-main); }
    .close-cart { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
    
    .cart-items { overflow-y: auto; flex: 1; margin-bottom: 12px; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .cart-item-title { font-weight: 600; margin-bottom: 2px; }
    .cart-item-price { color: var(--orange-main); font-weight: 700; }
    .cart-item-qty { display: flex; align-items: center; gap: 6px; }
    .btn-qty { background: var(--card-dark); border: 1px solid var(--border-dark); color: white; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; }
    
    /* Form Pembeli & Opsi Pembayaran */
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }

    .payment-section {
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .payment-title { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    .payment-options { display: flex; flex-direction: column; gap: 6px; }
    .payment-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .payment-label input { accent-color: var(--orange-main); }

    .cart-footer { border-top: 1px solid var(--border-dark); padding-top: 10px; }
    .cart-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 13px; margin-bottom: 10px; }
    .btn-checkout {
      width: 100%;
      background: var(--orange-main);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .btn-checkout:hover { background: var(--orange-hover); }

    .footer { max-width: 900px; width: 100%; margin: 12px auto 0 auto; text-align: center; color: var(--text-muted); font-size: 11px; }
  </style>
</head>
<body>

  <!-- Running Text Pengumuman -->
  <div class="announce-bar" id="announceBar">
    <i class="fa-solid fa-bullhorn"></i>
    <marquee id="announceText"></marquee>
  </div>

  <!-- Header Navigasi -->
  <nav class="top-nav">
    <a href="index.html" class="brand-logo"><i class="fa-solid fa-bag-shopping"></i> Toko Kyy</a>
    <div class="nav-links">
      <button class="nav-btn active" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i> Keranjang <span class="badge" id="cartBadge">0</span></button>
      <a href="admin.html" class="nav-btn"><i class="fa-solid fa-user-gear"></i> Admin</a>
    </div>
  </nav>

  <!-- Container Toko Utama -->
  <div class="store-container">
    <div class="cat-filter" id="categoryFilter"></div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- Modal Pop-up Keranjang & Pembayaran -->
  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-box">
      <div class="cart-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> Checkout Pesanan</h3>
        <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="cart-items" id="cartItemList"></div>

      <!-- Form Data Pemesan -->
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="custName" placeholder="Masukkan nama Anda">
      </div>
      <div class="form-group">
        <label>Alamat Pengiriman</label>
        <textarea id="custAddress" rows="2" placeholder="Masukkan alamat lengkap"></textarea>
      </div>

      <!-- Pilih Metode Pembayaran -->
      <div class="payment-section">
        <div class="payment-title"><i class="fa-solid fa-wallet"></i> Metode Pembayaran:</div>
        <div class="payment-options">
          <label class="payment-label">
            <input type="radio" name="payMethod" value="Transfer Bank BCA" checked>
            <span>Bank BCA (No. Rek: 1234567890)</span>
          </label>
          <label class="payment-label">
            <input type="radio" name="payMethod" value="Transfer Bank BNI">
            <span>Bank BNI (No. Rek: 0987654321)</span>
          </label>
          <label class="payment-label">
            <input type="radio" name="payMethod" value="COD (Bayar di Tempat)">
            <span>COD (Bayar di Tempat)</span>
          </label>
        </div>
      </div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>Total Bayar:</span>
          <span id="cartTotalPrice" style="color:var(--orange-main);">Rp 0</span>
        </div>
        <button class="btn-checkout" onclick="processOrder()"><i class="fa-solid fa-circle-check"></i> Buat Pesanan Sekarang</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Toko Kyy. All rights reserved.</p>
  </footer>

  <script>
    let products = JSON.parse(localStorage.getItem("kyy_products")) || [
      { id: 1, name: "Kemeja Casual Oversize Kyy", price: 95000, kategori: "Fashion", img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400" },
      { id: 2, name: "Sepatu Sneaker Sport Pro", price: 165000, kategori: "Fashion", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" }
    ];
    let categories = JSON.parse(localStorage.getItem("kyy_categories")) || ["Semua", "Fashion", "Elektronik", "Rumah", "Aksesoris"];
    let cart = JSON.parse(localStorage.getItem("kyy_cart")) || [];
    let selectedCat = "Semua";

    document.addEventListener("DOMContentLoaded", () => {
      loadAnnounce();
      renderCategories();
      renderProducts();
      updateCartUI();
    });

    function loadAnnounce() {
      let ann = localStorage.getItem("kyy_announce");
      if (ann && ann.trim() !== "") {
        document.getElementById("announceText").innerText = ann;
        document.getElementById("announceBar").style.display = "flex";
      }
    }

    function renderCategories() {
      let catList = ["Semua", ...categories.filter(c => c !== "Semua")];
      document.getElementById("categoryFilter").innerHTML = catList.map(c => `
        <button class="cat-btn ${c === selectedCat ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>
      `).join('');
    }

    function filterCat(cat) {
      selectedCat = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      let grid = document.getElementById("productGrid");
      let filtered = selectedCat === "Semua" ? products : products.filter(p => p.kategori === selectedCat);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:12px; padding:20px;">Belum ada produk untuk kategori ini.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'">
          <div class="product-title">${p.name}</div>
          <div class="product-price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
          <div class="btn-action-group">
            <button class="btn-add-cart" onclick="addToCart(${p.id})">+ Keranjang</button>
            <button class="btn-buy-now" onclick="buyDirect(${p.id})">Beli</button>
          </div>
        </div>
      `).join('');
    }

    // --- FITUR KERANJANG BELANJA ---
    function addToCart(prodId) {
      let prod = products.find(p => p.id === prodId);
      if (!prod) return;

      let exist = cart.find(c => c.id === prodId);
      if (exist) {
        exist.qty += 1;
      } else {
        cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
      }

      saveCart();
      updateCartUI();
      alert(`"${prod.name}" masuk ke keranjang!`);
    }

    function buyDirect(prodId) {
      addToCart(prodId);
      toggleCart();
    }

    function updateCartQty(prodId, change) {
      let item = cart.find(c => c.id === prodId);
      if (item) {
        item.qty += change;
        if (item.qty <= 0) {
          cart = cart.filter(c => c.id !== prodId);
        }
      }
      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem("kyy_cart", JSON.stringify(cart));
    }

    function updateCartUI() {
      let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      document.getElementById("cartBadge").innerText = totalItems;
      document.getElementById("cartTotalPrice").innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;

      let cartList = document.getElementById("cartItemList");
      if (cart.length === 0) {
        cartList.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:12px; padding:20px;">Keranjang masih kosong.</p>`;
        return;
      }

      cartList.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div class="cart-item-title">${item.name}</div>
            <div class="cart-item-price">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</div>
          </div>
          <div class="cart-item-qty">
            <button class="btn-qty" onclick="updateCartQty(${item.id}, -1)">-</button>
            <span><b>${item.qty}</b></span>
            <button class="btn-qty" onclick="updateCartQty(${item.id}, 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() {
      let overlay = document.getElementById("cartOverlay");
      overlay.style.display = overlay.style.display === "flex" ? "none" : "flex";
    }

    // --- PROSES PEMESANAN DIRECT (TANPA WHATSAPP) ---
    function processOrder() {
      if (cart.length === 0) return alert("Keranjang belanjaan Anda masih kosong!");

      let name = document.getElementById("custName").value.trim();
      let address = document.getElementById("custAddress").value.trim();
      let selectedPayment = document.querySelector('input[name="payMethod"]:checked').value;

      if (!name || !address) {
        return alert("Harap isi Nama Lengkap dan Alamat Pengiriman!");
      }

      let totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // Simpan riwayat transaksi ke localStorage untuk Admin
      let orders = JSON.parse(localStorage.getItem("kyy_orders")) || [];
      let newOrder = {
        id: "ORD-" + Date.now().toString().slice(-6),
        name: name,
        address: address,
        payment: selectedPayment,
        items: cart,
        total: totalPrice,
        date: new Date().toLocaleDateString('id-ID')
      };
      
      orders.push(newOrder);
      localStorage.setItem("kyy_orders", JSON.stringify(orders));

      // Reset Keranjang
      cart = [];
      saveCart();
      updateCartUI();
      toggleCart();

      // Notifikasi Berhasil
      alert(` Selesai!\n\nPesanan Anda ID: ${newOrder.id} berhasil dibuat.\nMetode Pembayaran: ${selectedPayment}\nTotal: Rp ${totalPrice.toLocaleString('id-ID')}\n\nTerima kasih telah berbelanja di Toko Kyy!`);
    }
  </script>
</body>
</html>
