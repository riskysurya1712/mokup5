<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Kyy - Online Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --orange-main: #f97316;
      --orange-hover: #ea580c;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
    
    html { height: 100%; }

    body { 
      background-color: var(--bg-dark); 
      color: var(--text-light); 
      padding: 12px; 
      line-height: 1.5; 
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Running Text Banner (Pengumuman Admin) */
    .announce-bar {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 10px auto;
      background: var(--orange-main);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: none; /* Muncul jika ada pengumuman dari admin */
      align-items: center;
      gap: 8px;
    }

    /* Top Nav */
    .top-nav {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 12px auto;
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--orange-main);
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 6px; }
    .nav-btn {
      background: var(--bg-dark);
      color: var(--text-light);
      border: 1px solid var(--border-dark);
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn.active { border-color: var(--orange-main); color: var(--orange-main); }
    .badge { background: var(--orange-main); color: white; border-radius: 10px; padding: 1px 6px; font-size: 10px; }

    /* Main Container toko */
    .store-container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      background: var(--card-dark);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border-dark);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Category Filter Bar */
    .cat-filter {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .cat-btn {
      background: var(--bg-dark);
      color: var(--text-muted);
      border: 1px solid var(--border-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active { background: var(--orange-main); color: white; border-color: var(--orange-main); }

    /* Grid Produk */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .product-card {
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .product-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .product-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .product-price { font-size: 13px; font-weight: 700; color: var(--orange-main); margin-bottom: 8px; }
    .btn-add-cart {
      margin-top: auto;
      background: var(--orange-main);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer { max-width: 900px; width: 100%; margin: 12px auto 0 auto; text-align: center; color: var(--text-muted); font-size: 11px; }
  </style>
</head>
<body>

  <!-- Running Text Pengumuman -->
  <div class="announce-bar" id="announceBar">
    <i class="fa-solid fa-bullhorn"></i>
    <marquee id="announceText"></marquee>
  </div>

  <!-- Header Navigasi -->
  <nav class="top-nav">
    <a href="index.html" class="brand-logo"><i class="fa-solid fa-bag-shopping"></i> Toko Kyy</a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn active"><i class="fa-solid fa-store"></i> Toko</a>
      <a href="admin.html" class="nav-btn"><i class="fa-solid fa-user-gear"></i> Admin</a>
    </div>
  </nav>

  <!-- Container Toko Utama -->
  <div class="store-container">
    <!-- Filter Kategori Dinamis dari Admin -->
    <div class="cat-filter" id="categoryFilter"></div>

    <!-- Katalog Produk Dinamis dari Admin -->
    <div class="product-grid" id="productGrid"></div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 Toko Kyy. All rights reserved.</p>
  </footer>

  <script>
    let products = JSON.parse(localStorage.getItem("kyy_products")) || [];
    let categories = JSON.parse(localStorage.getItem("kyy_categories")) || ["Semua", "Fashion", "Elektronik", "Rumah", "Aksesoris"];
    let selectedCat = "Semua";

    document.addEventListener("DOMContentLoaded", () => {
      loadAnnounce();
      renderCategories();
      renderProducts();
    });

    // Memuat Running Text dari Pengaturan Admin
    function loadAnnounce() {
      let ann = localStorage.getItem("kyy_announce");
      if (ann && ann.trim() !== "") {
        document.getElementById("announceText").innerText = ann;
        document.getElementById("announceBar").style.display = "flex";
      }
    }

    // Memuat Kategori yang dibuat Admin
    function renderCategories() {
      let catList = ["Semua", ...categories.filter(c => c !== "Semua")];
      document.getElementById("categoryFilter").innerHTML = catList.map(c => `
        <button class="cat-btn ${c === selectedCat ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>
      `).join('');
    }

    function filterCat(cat) {
      selectedCat = cat;
      renderCategories();
      renderProducts();
    }

    // Memuat Daftar Produk dari Admin
    function renderProducts() {
      let grid = document.getElementById("productGrid");
      let filtered = selectedCat === "Semua" ? products : products.filter(p => p.kategori === selectedCat);

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:12px; padding:20px;">Belum ada produk untuk kategori ini.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'">
          <div class="product-title">${p.name}</div>
          <div class="product-price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
          <button class="btn-add-cart" onclick="checkoutWA('${p.name}', ${p.price})">Beli Sekarang</button>
        </div>
      `).join('');
    }

    // Fitur Beli via WA menggunakan No HP dari Pengaturan Admin
    function checkoutWA(prodName, price) {
      let waNumber = localStorage.getItem("kyy_wa") || "628123456789";
      let msg = encodeURIComponent(`Halo Toko Kyy, saya ingin membeli:\n\n*Produk:* ${prodName}\n*Harga:* Rp ${price.toLocaleString('id-ID')}`);
      window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
    }
  </script>
</body>
</html>
