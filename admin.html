<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin System - Toko Kyy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --orange-main: #f97316;
      --orange-hover: #ea580c;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
    
    html { height: 100%; }

    body { 
      background-color: var(--bg-dark); 
      color: var(--text-light); 
      padding: 16px; 
      line-height: 1.5; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-nav {
      max-width: 900px;
      width: 100%;
      margin: 0 auto 16px auto;
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--orange-main);
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-btn {
      background: var(--bg-dark);
      color: var(--text-light);
      border: 1px solid var(--border-dark);
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn.active, .nav-btn:hover { border-color: var(--orange-main); color: var(--orange-main); }

    /* Modal Login */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.98);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .login-box {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      padding: 32px;
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
    }
    .login-box h3 { color: var(--orange-main); margin-bottom: 8px; text-align: center; font-size: 22px; }
    .login-box p { color: var(--text-muted); font-size: 13px; text-align: center; margin-bottom: 20px; }

    /* Layout Admin Flex */
    .admin-container { 
      max-width: 900px; 
      width: 100%;
      margin: 0 auto; 
      background: var(--card-dark); 
      border-radius: var(--radius); 
      padding: 20px; 
      border: 1px solid var(--border-dark); 
      flex: 1;
    }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-dark); padding-bottom: 14px; margin-bottom: 16px; }
    .admin-header h2 { color: var(--orange-main); font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .btn-logout { color: var(--text-muted); text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-dark); border: 1px solid var(--border-dark); border-radius: 6px; cursor: pointer; }
    .btn-logout:hover { color: #ef4444; border-color: #ef4444; }

    /* Grid Statistik */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--bg-dark); border: 1px solid var(--border-dark); padding: 12px; border-radius: var(--radius); }
    .stat-card h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
    .stat-card p { font-size: 18px; font-weight: 700; color: var(--orange-main); }

    /* Menu Tab Admin */
    .admin-tabs-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
    .admin-tab-btn { background: var(--bg-dark); color: var(--text-muted); border: 1px solid var(--border-dark); padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; }
    .admin-tab-btn.active { background: var(--orange-main); color: white; border-color: var(--orange-main); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border-dark); border-radius: 6px; color: white; font-size: 13px; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--orange-main); }

    .btn-orange-submit { width: 100%; background: var(--orange-main); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-orange-submit:hover { background: var(--orange-hover); }

    .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid var(--border-dark); text-align: left; }
    .admin-table th { background: var(--bg-dark); color: var(--text-muted); font-size: 10px; text-transform: uppercase; }
    .btn-del { color: #ef4444; background: none; border: none; cursor: pointer; font-weight: 600; }

    /* List Kategori & Log */
    .item-list { list-style: none; }
    .item-list li { background: var(--bg-dark); border: 1px solid var(--border-dark); padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

    .admin-footer { max-width: 900px; width: 100%; margin: 16px auto 0 auto; text-align: center; color: var(--text-muted); font-size: 11px; }
  </style>
</head>
<body>

  <!-- Modal Login -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h3><i class="fa-solid fa-lock"></i> Login Admin</h3>
      <p>Akses Control Panel Toko Kyy</p>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Masukkan username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Masukkan password">
      </div>
      <button class="btn-orange-submit" onclick="handleLogin()">Masuk Admin</button>
      <a href="index.html" style="display:block; text-align:center; color:var(--text-muted); margin-top:12px; font-size:12px; text-decoration:none;">Kembali ke Toko</a>
    </div>
  </div>

  <!-- Header -->
  <nav class="top-nav">
    <a href="index.html" class="brand-logo"><i class="fa-solid fa-bag-shopping"></i> Toko Kyy</a>
    <div class="nav-links">
      <a href="index.html" class="nav-btn"><i class="fa-solid fa-store"></i> Katalog Toko</a>
      <a href="#" class="nav-btn active"><i class="fa-solid fa-user-gear"></i> Panel Admin</a>
    </div>
  </nav>

  <!-- Main Container Admin -->
  <div class="admin-container">
    <div class="admin-header">
      <h2><i class="fa-solid fa-user-gear"></i> Control Panel Admin</h2>
      <button class="btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
    </div>

    <!-- Statistik Ringkas -->
    <div class="stats-grid">
      <div class="stat-card">
        <h4>PRODUK</h4>
        <p id="admTotProd">0</p>
      </div>
      <div class="stat-card">
        <h4>KATEGORI</h4>
        <p id="admTotKat">0</p>
      </div>
      <div class="stat-card">
        <h4>PENJUALAN</h4>
        <p id="admTotSales">0</p>
      </div>
    </div>

    <!-- Navigasi Menu Tab -->
    <div class="admin-tabs-bar">
      <button class="admin-tab-btn active" onclick="switchAdminTab('add', this)">+ Tambah Produk</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('list', this)">Kelola Produk</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('kat', this)">Kategori</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('settings', this)">Pengaturan Toko</button>
      <button class="admin-tab-btn" onclick="switchAdminTab('sales', this)">Laporan</button>
    </div>

    <!-- Tab 1: Form Tambah Produk -->
    <div id="admTabAdd">
      <div class="form-group">
        <label>Nama Produk</label>
        <input type="text" id="newProdName" placeholder="Contoh: Jaket Denim Vintage">
      </div>
      <div class="form-group">
        <label>Harga (Rp)</label>
        <input type="number" id="newProdPrice" placeholder="150000">
      </div>
      <div class="form-group">
        <label>Jumlah Stok</label>
        <input type="number" id="newProdStock" placeholder="20">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="newProdKat"></select>
      </div>
      <div class="form-group">
        <label>URL Gambar</label>
        <input type="text" id="newProdImg" placeholder="https://images.unsplash.com/...">
      </div>
      <button class="btn-orange-submit" onclick="addNewProduct()">Simpan Produk</button>
    </div>

    <!-- Tab 2: Tabel Produk -->
    <div id="admTabList" style="display:none;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama</th>
            <th>Harga</th>
            <th>Stok</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="admProductTable"></tbody>
      </table>
    </div>

    <!-- Tab 3: Kelola Kategori -->
    <div id="admTabKat" style="display:none;">
      <div class="form-group">
        <label>Nama Kategori Baru</label>
        <input type="text" id="newKatName" placeholder="Contoh: Sepatu">
      </div>
      <button class="btn-orange-submit" onclick="addCategory()" style="margin-bottom:16px;">Tambah Kategori</button>
      <ul class="item-list" id="categoryList"></ul>
    </div>

    <!-- Tab 4: Pengaturan Toko -->
    <div id="admTabSettings" style="display:none;">
      <div class="form-group">
        <label>Pengumuman / Running Text Toko</label>
        <input type="text" id="storeAnnounce" placeholder="Diskon besar-besaran minggu ini!">
      </div>
      <div class="form-group">
        <label>Nomor WhatsApp Admin (Aktivasi Order)</label>
        <input type="text" id="storeWA" placeholder="628123456789">
      </div>
      <button class="btn-orange-submit" onclick="saveSettings()">Simpan Pengaturan</button>
    </div>

    <!-- Tab 5: Laporan Penjualan -->
    <div id="admTabSales" style="display:none;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Resi</th>
            <th>Pemesan</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="admSalesTable"></tbody>
      </table>
    </div>

  </div>

  <footer class="admin-footer">
    <p>&copy; 2026 Toko Kyy Management System</p>
  </footer>

  <script>
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "admin123";

    let categories = JSON.parse(localStorage.getItem("kyy_categories")) || ["Fashion", "Elektronik", "Rumah", "Aksesoris"];
    let products = JSON.parse(localStorage.getItem("kyy_products")) || [];
    let salesReport = JSON.parse(localStorage.getItem("kyy_sales")) || [];

    document.addEventListener("DOMContentLoaded", () => {
      checkLoginStatus();
      loadCategoriesSelect();
    });

    function checkLoginStatus() {
      const isLogged = sessionStorage.getItem("kyy_admin_logged");
      if (isLogged === "true") {
        document.getElementById("loginOverlay").style.display = "none";
        renderAdminData();
      } else {
        document.getElementById("loginOverlay").style.display = "flex";
      }
    }

    function handleLogin() {
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value.trim();
      if (u === ADMIN_USER && p === ADMIN_PASS) {
        sessionStorage.setItem("kyy_admin_logged", "true");
        document.getElementById("loginOverlay").style.display = "none";
        renderAdminData();
      } else {
        alert("Kredensial salah!");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("kyy_admin_logged");
      checkLoginStatus();
    }

    function switchAdminTab(tab, el) {
      document.querySelectorAll(".admin-tab-btn").forEach(b => b.classList.remove("active"));
      el.classList.add("active");

      document.getElementById("admTabAdd").style.display = tab === 'add' ? 'block' : 'none';
      document.getElementById("admTabList").style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById("admTabKat").style.display = tab === 'kat' ? 'block' : 'none';
      document.getElementById("admTabSettings").style.display = tab === 'settings' ? 'block' : 'none';
      document.getElementById("admTabSales").style.display = tab === 'sales' ? 'block' : 'none';
    }

    function loadCategoriesSelect() {
      const sel = document.getElementById("newProdKat");
      sel.innerHTML = categories.map(k => `<option value="${k}">${k}</option>`).join('');
    }

    function renderAdminData() {
      products = JSON.parse(localStorage.getItem("kyy_products")) || [];
      salesReport = JSON.parse(localStorage.getItem("kyy_sales")) || [];

      document.getElementById("admTotProd").innerText = products.length;
      document.getElementById("admTotKat").innerText = categories.length;
      document.getElementById("admTotSales").innerText = salesReport.length;

      // Render Produk Table
      document.getElementById("admProductTable").innerHTML = products.length === 0 ? 
        `<tr><td colspan="5" style="text-align:center;">Belum ada produk</td></tr>` :
        products.map((p, i) => `
          <tr>
            <td>#${p.id}</td>
            <td>${p.name}</td>
            <td>Rp ${Number(p.price).toLocaleString('id-ID')}</td>
            <td><b>${p.stok || 0}</b></td>
            <td><button class="btn-del" onclick="delProduct(${i})">Hapus</button></td>
          </tr>
        `).join('');

      // Render Kategori List
      document.getElementById("categoryList").innerHTML = categories.map((k, i) => `
        <li>
          <span>${k}</span>
          <button class="btn-del" onclick="delCategory(${i})">Hapus</button>
        </li>
      `).join('');

      // Load Settings
      document.getElementById("storeAnnounce").value = localStorage.getItem("kyy_announce") || "";
      document.getElementById("storeWA").value = localStorage.getItem("kyy_wa") || "";
    }

    function addNewProduct() {
      let name = document.getElementById("newProdName").value.trim();
      let price = Number(document.getElementById("newProdPrice").value);
      let stok = Number(document.getElementById("newProdStock").value) || 0;
      let kategori = document.getElementById("newProdKat").value;
      let img = document.getElementById("newProdImg").value.trim() || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";

      if (!name || isNaN(price) || price <= 0) return alert("Isi nama & harga dengan benar!");

      products.push({ id: Date.now(), name, price, stok, kategori, img });
      localStorage.setItem("kyy_products", JSON.stringify(products));

      document.getElementById("newProdName").value = "";
      document.getElementById("newProdPrice").value = "";
      document.getElementById("newProdStock").value = "";
      document.getElementById("newProdImg").value = "";

      alert("Produk Berhasil Ditambahkan!");
      renderAdminData();
      switchAdminTab('list', document.querySelectorAll('.admin-tab-btn')[1]);
    }

    function delProduct(i) {
      if (confirm("Hapus produk ini?")) {
        products.splice(i, 1);
        localStorage.setItem("kyy_products", JSON.stringify(products));
        renderAdminData();
      }
    }

    function addCategory() {
      let val = document.getElementById("newKatName").value.trim();
      if (val && !categories.includes(val)) {
        categories.push(val);
        localStorage.setItem("kyy_categories", JSON.stringify(categories));
        document.getElementById("newKatName").value = "";
        loadCategoriesSelect();
        renderAdminData();
      }
    }

    function delCategory(i) {
      categories.splice(i, 1);
      localStorage.setItem("kyy_categories", JSON.stringify(categories));
      loadCategoriesSelect();
      renderAdminData();
    }

    function saveSettings() {
      let ann = document.getElementById("storeAnnounce").value.trim();
      let wa = document.getElementById("storeWA").value.trim();
      localStorage.setItem("kyy_announce", ann);
      localStorage.setItem("kyy_wa", wa);
      alert("Pengaturan Berhasil Disimpan!");
    }
  </script>
</body>
</html>
