<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Toko Kyy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --orange-main: #f97316;
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 16px; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    .top-nav {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .brand-logo { color: var(--orange-main); font-weight: 700; text-decoration: none; font-size: 16px; }
    .btn-back { background: var(--bg-dark); color: var(--text-light); border: 1px solid var(--border-dark); padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; }

    .stats-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-val { font-size: 20px; font-weight: 700; color: var(--orange-main); }

    .card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--orange-main); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* Tabel Laporan */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { border: 1px solid var(--border-dark); padding: 10px; }
    th { background: var(--bg-dark); color: var(--text-muted); }
    
    .btn-danger { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .badge-pay { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-nav">
      <a href="#" class="brand-logo"><i class="fa-solid fa-user-gear"></i> Admin Toko Kyy</a>
      <a href="index.html" class="btn-back"><i class="fa-solid fa-store"></i> Ke Toko</a>
    </div>

    <!-- Ringkasan Penjualan -->
    <div class="stats-card">
      <div>
        <div style="font-size:12px; color:var(--text-muted);">Total Pendapatan</div>
        <div class="stat-val" id="totalIncome">Rp 0</div>
      </div>
      <div>
        <div style="font-size:12px; color:var(--text-muted);">Total Pesanan</div>
        <div class="stat-val" id="totalOrdersCount" style="color:white;">0</div>
      </div>
    </div>

    <!-- Tabel Laporan Pesanan -->
    <div class="card">
      <div class="card-title">
        <span><i class="fa-solid fa-list-check"></i> Laporan Pesanan Masuk</span>
        <button class="btn-danger" onclick="clearAllOrders()"><i class="fa-solid fa-trash"></i> Hapus Semua Laporan</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID & Tanggal</th>
              <th>Pemesan</th>
              <th>Detail Barang</th>
              <th>Pembayaran</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <!-- Data dimasukkan via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadOrdersReport();
    });

    function loadOrdersReport() {
      let orders = JSON.parse(localStorage.getItem("kyy_orders")) || [];
      let tbody = document.getElementById("orderTableBody");
      let totalIncome = 0;

      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:20px;">Belum ada data pesanan masuk.</td></tr>`;
        document.getElementById("totalIncome").innerText = "Rp 0";
        document.getElementById("totalOrdersCount").innerText = "0";
        return;
      }

      tbody.innerHTML = orders.map(ord => {
        totalIncome += ord.total;
        
        let itemsList = ord.items.map(item => `- ${item.name} (${item.qty}x)`).join('<br>');

        return `
          <tr>
            <td>
              <b>${ord.id}</b><br>
              <small style="color:var(--text-muted);">${ord.date}</small>
            </td>
            <td>
              <b>${ord.name}</b><br>
              <small style="color:var(--text-muted);">${ord.address}</small>
            </td>
            <td>${itemsList}</td>
            <td><span class="badge-pay">${ord.payment}</span></td>
            <td style="font-weight:700; color:var(--orange-main);">Rp ${ord.total.toLocaleString('id-ID')}</td>
          </tr>
        `;
      }).join('');

      document.getElementById("totalIncome").innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
      document.getElementById("totalOrdersCount").innerText = orders.length;
    }

    function clearAllOrders() {
      if (confirm("Apakah Anda yakin ingin menghapus semua laporan pesanan?")) {
        localStorage.removeItem("kyy_orders");
        loadOrdersReport();
      }
    }
  </script>
</body>
</html>
